name: Auto-Sync Live EPG Feed

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scrape & Build Live Guide
        run: python update_epg.py

      - name: Commit and Push Updated Feed
        run: |
          git config --local user.email "bot@mashadlauncher.org"
          git config --local user.name "Mashad Sync Bot"
          git add live_guide.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(epg): auto-update live TV schedule [skip ci]" && git push)
